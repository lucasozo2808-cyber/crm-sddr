<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CRM - SDDR</title><style>:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface-2:#eaf0f9; --line:#d8e2f0;
  --fg:#0b1f44; --muted:#5a6d8c; --accent:#1766d6; --accent-fg:#ffffff; --accent-soft:#e1edff;
  --cyan:#13dbeb; --navy:#062a6b; --danger:#d6293e;
  --c-agendado:#5a6d8c; --c-noshow:#b86e06; --c-show:#0b86d4; --c-negociacao:#6a4fd6; --c-perdido:#d6293e; --c-fechado:#0e8f55;
  --font:'Raleway',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 18px 50px rgba(6,42,107,.22); --card-shadow:0 1px 2px rgba(6,42,107,.06),0 6px 20px rgba(6,42,107,.06);
  --hero:linear-gradient(120deg,#0774c1 0%,#1d50a2 55%,#0a3a8c 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04122e; --surface:#0a1f4a; --surface-2:#0f2a5e; --line:#1d3a75;
    --fg:#eaf1ff; --muted:#8fa6cf; --accent:#3d8bff; --accent-fg:#ffffff; --accent-soft:#10306b; --danger:#ff8a95;
    --c-agendado:#9fb2d6; --c-noshow:#f0b24a; --c-show:#4cc2ff; --c-negociacao:#b3a1ff; --c-perdido:#ff8a95; --c-fechado:#4fd69a;
    --shadow:0 18px 50px rgba(0,0,0,.55); --card-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    --hero:linear-gradient(120deg,#0a4f8f 0%,#133b80 55%,#071f55 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04122e; --surface:#0a1f4a; --surface-2:#0f2a5e; --line:#1d3a75;
  --fg:#eaf1ff; --muted:#8fa6cf; --accent:#3d8bff; --accent-fg:#ffffff; --accent-soft:#10306b; --danger:#ff8a95;
  --c-agendado:#9fb2d6; --c-noshow:#f0b24a; --c-show:#4cc2ff; --c-negociacao:#b3a1ff; --c-perdido:#ff8a95; --c-fechado:#4fd69a;
  --shadow:0 18px 50px rgba(0,0,0,.55); --card-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --hero:linear-gradient(120deg,#0a4f8f 0%,#133b80 55%,#071f55 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45;
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.top h1{font-size:20px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:12.5px}
.note{padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--accent-soft);color:var(--fg)}

/* fields */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
input,select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;
}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}

/* filters + stats */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}
.summary{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.summary b{color:var(--fg);font-weight:600}

/* agenda rows */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:110px minmax(0,2.2fr) minmax(0,1fr) 150px auto;gap:6px 16px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.when{display:flex;flex-direction:column}
.when b{font-weight:500}
.when span{color:var(--muted)}
.who b{font-weight:600}
.who .sub{color:var(--muted);display:flex;flex-wrap:wrap;gap:0 12px}
.who .obs{margin:4px 0 0;color:var(--fg);opacity:.85;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.acts{display:flex;gap:6px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font-weight:600}

/* chips */
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.inbound{background:var(--accent-soft);color:var(--accent)}
.chip.outbound{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.s-agendado{--st:var(--c-agendado)} .s-noshow{--st:var(--c-noshow)} .s-show{--st:var(--c-show)}
.s-negociacao{--st:var(--c-negociacao)} .s-perdido{--st:var(--c-perdido)} .s-fechado{--st:var(--c-fechado)}
.st-select{
  color:var(--st);background:color-mix(in srgb,var(--st) 13%,var(--surface));
  border-color:color-mix(in srgb,var(--st) 40%,var(--line));font-weight:600;padding:5px 8px;
}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px}
.col-h h3{font-size:13px;display:flex;align-items:center;gap:8px}
.col-h h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--st)}
.col-h .count{color:var(--muted);font-family:var(--mono);font-size:12px}
.col-sum{padding:0 4px;color:var(--muted);font-size:12px;margin-top:-6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.card.dragging{opacity:.45}
.card b{font-weight:600;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.card .line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .value{font-family:var(--mono);font-weight:500;color:var(--c-fechado)}
.mover{display:none}
@media (hover:none){.mover{display:block}.card{cursor:default}}
.drop-hint{color:var(--muted);text-align:center;padding:18px 6px;font-size:12.5px;border:1px dashed var(--line);border-radius:10px}

/* comissao */
.comm-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.comm-head .field{width:200px}
.rule{color:var(--muted);margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.totals{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.panel .k{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.02em}
.panel .v{font-family:var(--mono);font-size:19px;font-weight:500}
.panel.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.panel.main .k{color:inherit;opacity:.85}
.panel.main .v{font-size:28px}
.panel .h{color:var(--muted);font-size:12px}
.panel.main .h{color:inherit;opacity:.85}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.02em;background:var(--surface-2)}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;background:var(--surface-2)}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(6,16,15,.55);overflow-y:auto;
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:560px;margin-block:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;font-weight:500;background:var(--surface)}
.seg input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:12.5px;margin:0;min-height:1em}
.cnpj-row{display:flex;gap:8px}.cnpj-row input{flex:1;min-width:0}
.cnpj-msg{font-size:12.5px;color:var(--muted);margin:0;min-height:1em}.cnpj-msg.warn{color:var(--danger)}
.preview{padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-x{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px;font-weight:500}
.chip-x button{border:0;background:transparent;color:var(--muted);border-radius:99px;width:22px;height:22px;line-height:1}
.chip-x button:hover{background:var(--line)}
.addrow{display:flex;gap:8px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);
  padding:9px 16px;border-radius:99px;font-weight:500;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
}

@media (max-width:980px){
  .filters{grid-template-columns:1fr 1fr 1fr}
  .filters .field:first-child{grid-column:1/-1}
  .totals{grid-template-columns:1fr 1fr}
  .panel.main{grid-column:1/-1}
}
@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who st" "when meta" "acts acts"}
  .row .who{grid-area:who} .row .stat{grid-area:st} .row .when{grid-area:when;flex-direction:row;gap:8px}
  .row .meta{grid-area:meta;flex-direction:row;align-items:center;gap:8px} .row .acts{grid-area:acts}
  .filters{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .comm-head .field{width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ===== identidade VERI ===== */
.hs-link{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
.hs-link:hover{text-decoration:underline}
.card .hs-link{margin-top:0}
body{font-weight:500;background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg)}
.top{background:var(--hero);color:#fff;padding:14px 20px;border-radius:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(19,219,235,.35),transparent 68%);pointer-events:none}
.top>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;letter-spacing:0}
.brand svg{height:34px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:rgba(255,255,255,.35)}
.brand .app-name{font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.01em}
.tabs{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);border-radius:99px;backdrop-filter:blur(6px)}
.tab{color:rgba(255,255,255,.82);border-radius:99px;font-weight:600;padding:7px 18px}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:#fff;color:#0a3a8c;box-shadow:0 2px 8px rgba(0,20,70,.25)}
.top .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff;border-radius:99px;font-weight:600}
.top .btn:hover{background:rgba(255,255,255,.24)}
.top .btn.primary{background:var(--cyan);border-color:var(--cyan);color:#042055}
.top .btn.primary:hover{filter:brightness(1.06);background:var(--cyan)}
.btn{border-radius:99px;font-weight:600}
.btn.primary{background:linear-gradient(120deg,#1a7be0,#1d50a2);border-color:transparent}
.note{border-radius:14px;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
input,select,textarea{border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
:focus-visible{outline-color:var(--cyan)}
.field>span{font-weight:600;color:var(--muted)}
.list,.table-wrap,.panel,.col{border-radius:18px;box-shadow:var(--card-shadow)}
.row:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.card{border-radius:14px;box-shadow:var(--card-shadow);transition:transform .15s,box-shadow .15s;border-left:3px solid var(--st,var(--accent))}
.card:hover{transform:translateY(-1px)}
.col{background:var(--surface-2);box-shadow:none}
.col-h h3{font-weight:700}
.chip{font-weight:700}
.chip.inbound{background:color-mix(in srgb,var(--cyan) 22%,var(--surface));color:var(--accent)}
.panel.main{background:var(--hero);border-color:transparent;box-shadow:var(--shadow)}
.panel .v,.num,.count{letter-spacing:-.01em}
th{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.overlay{background:rgba(3,16,48,.62);backdrop-filter:blur(3px)}
.modal{border-radius:22px}
.modal-h{background:var(--hero);color:#fff;border-radius:22px 22px 0 0;border-bottom:0}
.modal-h .x{color:#fff}.modal-h .x:hover{background:rgba(255,255,255,.18)}
.seg span{border-radius:12px;font-weight:600}
.seg input:checked+span{background:linear-gradient(120deg,#1a7be0,#1d50a2)}
.toast{background:var(--navy);color:#fff;border:1px solid rgba(19,219,235,.5)}

.top-actions{align-items:center;flex-wrap:wrap}
.user-mail{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.locked .app,body.locked .toast{display:none}
.auth{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--hero);overflow-y:auto}
.auth-card{background:var(--surface);color:var(--fg);border-radius:22px;max-width:400px;width:100%;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth-logo{background:var(--hero);border-radius:14px;padding:16px;display:flex;justify-content:center}
.auth-logo svg{height:38px;width:auto}
.auth-card h2{font-size:19px;font-weight:700}
.auth-card p{margin:0;color:var(--muted)}
.auth-card form{display:flex;flex-direction:column;gap:12px}
.auth-card .btn.primary{padding:11px 14px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:4px;text-align:center}
.linkbtn:hover{text-decoration:underline}
.auth-msg{margin:0;font-size:13px;min-height:1em;color:var(--danger)}
.auth-msg.ok{color:var(--c-fechado)}
@media (max-width:720px){.user-mail{display:none}}
@media (max-width:720px){.brand .sep,.brand .app-name{display:none}}

<script>
(function(){
'use strict';

/* A configuração do Firebase fica em firebase-config.js */
var FIREBASE_CONFIG=window.FIREBASE_CONFIG||{apiKey:'COLE_AQUI'};
var FB_ON=String(FIREBASE_CONFIG.apiKey||'COLE_AQUI').indexOf('COLE_AQUI')<0;

var STATUS=[
  {id:'agendado',label:'Agendado'},
  {id:'noshow',label:'No show'},
  {id:'show',label:'Show'},
  {id:'negociacao',label:'Negociação'},
  {id:'perdido',label:'Perdido'},
  {id:'fechado',label:'Fechado'}
];

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var moneyFmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function brl(n){return moneyFmt.format(n||0)}
function parseMoney(s){
  s=String(s||'').trim().replace(/[^\d.,]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>-1) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return parseFloat(s);
}
function hsUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function hsLink(a,cls){return a.hubspot?'<a class="hs-link'+(cls?' '+cls:'')+'" href="'+esc(a.hubspot)+'" target="_blank" rel="noopener noreferrer">Abrir no HubSpot ↗</a>':''}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function monthLabel(key){
  var p=key.split('-'), t=new Date(+p[0],+p[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return t.charAt(0).toUpperCase()+t.slice(1);

function statusLabel(id){var s=STATUS.filter(function(x){return x.id===id})[0];return s?s.label:id}

function maskPhone(v){

/* commission */
function mesDe(a){return (a.fechadoEm||'').slice(0,7)}
function totalMes(mes,exceto){
  return agendas.reduce(function(t,x){return t+((x.status==='fechado'&&mesDe(x)===mes&&x.id!==exceto)?(x.valor||0):0)},0);
}
function rateByTotal(tipo,total){
  if(tipo==='inbound') return +cfg.inbound;
  return total>=+cfg.limite ? +cfg.outboundAlto : +cfg.outbound;
}
function rateFor(a){return rateByTotal(a.tipo,totalMes(mesDe(a)))}

/* ---------- storage ---------- */
function dbStore(db){
  var col=db.collection('agendas'), cfgRef=db.doc('config/main'), queues={};
  function seq(key,fn){
    var p=(queues[key]||Promise.resolve()).catch(function(){}).then(fn);
    queues[key]=p; return p;
  }
  var timer=setTimeout(function(){
    if(!loaded) showNote('O armazenamento ainda não respondeu. Seus dados aparecem aqui assim que a conexão voltar.');
  },10000);
  col.onSnapshot(function(snap){
    agendas=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    loaded=true;
    if(!snap.metadata.fromCache){clearTimeout(timer);hideNote()}
    renderAll();
  },function(e){loaded=true;showNote(e&&e.code==='permission-denied'?'Este e-mail não tem acesso ao CRM. Entre com seu e-mail @veri.com.br ou peça liberação ao administrador.':'Não consegui ler as agendas ('+(e&&e.code||'erro')+').');renderAll()});
  cfgRef.onSnapshot(function(s){
    cfg=Object.assign({},DEFAULT_CFG,s.exists?s.data():{});
    renderAll();
  },function(){});
  return {
    mode:'db',
    newId:function(){return col.doc().id},
    save:function(a){
      var body=Object.assign({},a); delete body.id;
      return seq(a.id,function(){return col.doc(a.id).set(body)}).catch(fail);
    },
    remove:function(id){return seq(id,function(){return col.doc(id).delete()}).catch(fail)},
    saveCfg:function(c){return seq('cfg',function(){return cfgRef.set(c)}).catch(fail)}
  };
}
function localStore(){
  try{agendas=JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){agendas=[]}
  try{cfg=Object.assign({},DEFAULT_CFG,JSON.parse(localStorage.getItem(LS_CFG)||'{}'))}catch(e){}
  loaded=true;
  function persist(){try{localStorage.setItem(LS_KEY,JSON.stringify(agendas))}catch(e){}}
  showNote('Firebase não configurado: salvando apenas neste navegador. Preencha o arquivo firebase-config.js.');
  return {
    mode:'local',
    newId:function(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},
    save:function(a){
      var i=agendas.findIndex(function(x){return x.id===a.id});
      if(i>-1) agendas[i]=a; else agendas.push(a);
      persist(); renderAll(); return Promise.resolve();
    },
    remove:function(id){agendas=agendas.filter(function(x){return x.id!==id});persist();renderAll();return Promise.resolve()},
    saveCfg:function(c){cfg=Object.assign({},c);try{localStorage.setItem(LS_CFG,JSON.stringify(c))}catch(e){}renderAll();return Promise.resolve()}
  };
}

/* ---------- consulta de CNPJ ---------- */
function cnpjLimpo(v){return String(v||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase().slice(0,14)}
function maskCnpj(v){
  var d=cnpjLimpo(v), o='';
  for(var i=0;i<d.length;i++){
    if(i===2||i===5)o+='.'; else if(i===8)o+='/'; else if(i===12)o+='-';
    o+=d.charAt(i);
  }
  return o;
}
function cnpjValido(v){
  var d=cnpjLimpo(v);
  if(!/^[0-9A-Z]{12}[0-9]{2}$/.test(d)||/^(.)\1{13}$/.test(d))return false;
  function dv(base){
    var w=base.length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2], t=0;
    for(var i=0;i<base.length;i++)t+=(base.charCodeAt(i)-48)*w[i];
    var r=t%11; return r<2?0:11-r;
  }
  var d1=dv(d.slice(0,12)), d2=dv(d.slice(0,12)+d1);
  return d1===+d.charAt(12)&&d2===+d.charAt(13);
}
function getJSON(url,ms){
  var ctl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctl)ctl.abort()},ms||10000);
  return fetch(url,{headers:{'Accept':'application/json'},signal:ctl?ctl.signal:undefined}).then(function(r){
    clearTimeout(t);
    if(!r.ok){var e=new Error('http');e.status=r.status;throw e}
    return r.json();
  },function(e){clearTimeout(t);throw e});
}
function fromBrasilApi(j){
  return {fonte:'brasilapi',razao:j.razao_social||'',fantasia:j.nome_fantasia||'',situacao:j.descricao_situacao_cadastral||'',
    cidade:j.municipio||'',uf:j.uf||'',cnae:j.cnae_fiscal_descricao||'',
    telefone:String(j.ddd_telefone_1||'').replace(/\D/g,''),email:String(j.email||'').toLowerCase(),
    socios:(j.qsa||[]).map(function(x){return {nome:x.nome_socio||'',qual:x.qualificacao_socio||''}})};
}
function fromCnpjWs(j){
  var e=j.estabelecimento||{};
  return {fonte:'cnpjws',razao:j.razao_social||'',fantasia:e.nome_fantasia||'',situacao:e.situacao_cadastral||'',
    cidade:(e.cidade&&e.cidade.nome)||'',uf:(e.estado&&e.estado.sigla)||'',cnae:(e.atividade_principal&&e.atividade_principal.descricao)||'',
    telefone:((e.ddd1||'')+(e.telefone1||'')).replace(/\D/g,''),email:String(e.email||'').toLowerCase(),
    socios:(j.socios||[]).map(function(x){return {nome:x.nome||'',qual:(x.qualificacao_socio&&x.qualificacao_socio.descricao)||''}})};
}
function buscarCnpj(cnpj){
  return getJSON('https://brasilapi.com.br/api/cnpj/v1/'+cnpj).then(fromBrasilApi,function(e){
    if(e&&e.status===404)throw e;
    return getJSON('https://publica.cnpj.ws/cnpj/'+cnpj).then(fromCnpjWs);
  }).then(function(d){
    if(d.email||d.fonte==='cnpjws')return d;
    /* a BrasilAPI costuma não trazer e-mail: tenta uma segunda fonte, sem travar se falhar */
    return getJSON('https://publica.cnpj.ws/cnpj/'+cnpj,8000).then(function(j){
      var x=fromCnpjWs(j); d.email=x.email; if(!d.telefone)d.telefone=x.telefone; return d;
    },function(){return d});
  });
}

  var form=$('#af',m), st=$('#af-status',m), fech=$('#af-fech',m);

  function preencher(r,d){
    var nomeEl=$('#af-nome',m), telEl=$('#af-tel',m), emEl=$('#af-email',m), obsEl=$('#af-obs',m), feito=[];
    if(!nomeEl.value.trim()){nomeEl.value=r.fantasia||r.razao; feito.push('nome')}

    if(!emEl.value.trim()&&r.email){emEl.value=r.email; feito.push('e-mail')}

      if(r.socios.length){
        var ss=r.socios.slice(0,5).map(function(x){return x.nome+(x.qual?' ('+x.qual+')':'')}).join('; ');
        if(r.socios.length>5)ss+='; e mais '+(r.socios.length-5);
        partes.push('Sócios: '+ss);
      }
      var txt=partes.join(' · ');
      obsEl.value=(obsEl.value.trim()?obsEl.value.trim()+'\n\n':'')+txt;

    }
    var sit=String(r.situacao||'').toUpperCase(), ativa=!sit||sit==='ATIVA';

  cn.addEventListener('input',function(e){e.target.value=maskCnpj(e.target.value)});
  cn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();lookup()}});
  cgo.addEventListener('click',lookup);

    var email=$('#af-email',m).value.trim();
    if(email&&!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Esse e-mail não parece válido.';return}
    var out=Object.assign({},a,{
      id:a.id||store.newId(),

    });
    if(status==='fechado'){

      if(!(sv>0)){err.textContent='Informe o valor do setup para registrar o fechamento.';$('#af-setup',m).focus();return}
      if(!(v>0)){err.textContent='Informe a mensalidade para registrar o fechamento.';$('#af-valor',m).focus();return}
      out.setup=sv; out.valor=v; out.fechadoEm=$('#af-fdata',m).value||todayISO();
    }
    commit(out); closeModal(); toast(isNew?'Agenda cadastrada':'Agenda atualizada');
  });
}

/* closing modal */
function openFechamento(a){
  var m=openModal('Fechar negócio',
    '<form id="ff" novalidate style="display:flex;flex-direction:column;gap:14px">'+
      '<div><b>'+esc(a.nome)+'</b><div style="color:var(--muted)">'+tipoLabel(a.tipo)+(a.consultor?' · '+esc(a.consultor):'')+'</div></div>'+
      '<div class="grid2">'+
        '<label class="field"><span>Setup (R$)</span><input id="ff-setup" inputmode="decimal" value="'+(a.setup?esc(String(a.setup).replace('.',',')):'')+'" placeholder="0,00"></label>'+
        '<label class="field"><span>Mensalidade (R$)</span><input id="ff-valor" inputmode="decimal" value="'+(a.valor?esc(String(a.valor).replace('.',',')):'')+'" placeholder="0,00"></label>'+
      '</div>'+
      '<label class="field"><span>Data do fechamento</span><input id="ff-data" type="date" value="'+esc(a.fechadoEm||todayISO())+'"></label>'+
      '<div class="preview" id="ff-prev" aria-live="polite"></div>'+
      '<p class="err" id="ff-err" role="alert"></p>'+
      '<div class="modal-f"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn primary">Confirmar fechamento</button></div>'+
    '</form>');
  var inp=$('#ff-valor',m), sin=$('#ff-setup',m), dat=$('#ff-data',m), prev=$('#ff-prev',m);
  function upd(){
    var v=parseMoney(inp.value), sv=parseMoney(sin.value);
    if(!(sv>0)){prev.textContent='Informe o setup para ver a comissão.';return}
    var mes=(dat.value||todayISO()).slice(0,7), total=totalMes(mes,a.id)+(v>0?v:0), r=rateByTotal(a.tipo,total), nota='';
    if(a.tipo!=='inbound')nota=total>=+cfg.limite?' Meta do mês batida ('+brl(total)+' de '+brl(cfg.limite)+'): todo o outbound do mês fica em '+pct(cfg.outboundAlto)+'.':' Mensalidades do mês: '+brl(total)+' de '+brl(cfg.limite)+'.';
    prev.innerHTML='Comissão de <b class="num">'+pct(r)+'</b> sobre o setup de '+brl(sv)+': <b class="num">'+brl(sv*r/100)+'</b>'+esc(nota);
  }
  inp.addEventListener('input',upd); sin.addEventListener('input',upd); dat.addEventListener('change',upd); upd();
  $('#ff',m).addEventListener('submit',function(e){
    e.preventDefault();
    var v=parseMoney(inp.value), sv=parseMoney(sin.value);
    if(!(sv>0)){$('#ff-err',m).textContent='Informe o valor do setup.';sin.focus();return}
    if(!(v>0)){$('#ff-err',m).textContent='Informe a mensalidade do cliente.';inp.focus();return}
    commit(Object.assign({},a,{status:'fechado',setup:sv,valor:v,fechadoEm:$('#ff-data',m).value||todayISO()}));
    closeModal(); toast('Fechamento registrado');
  });
}

function agendaById(id){return agendas.filter(function(a){return a.id===id})[0]}

  commit(Object.assign({},a,{status:status}));
}

/* ---------- login (Firebase Authentication) ---------- */
function authMsg(e){
  var c=e&&e.code||'';
  if(c==='auth/invalid-email')return 'E-mail inválido.';
  if(c==='auth/weak-password')return 'A senha precisa ter pelo menos 6 caracteres.';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'E-mail ou senha incorretos.';
  if(c==='auth/too-many-requests')return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
  if(c==='auth/network-request-failed')return 'Sem conexão. Verifique a internet.';
  return 'Não foi possível entrar'+(c?' ('+c+')':'')+'.';
}
function startAuth(){
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth=firebase.auth(), box=null;
  document.body.classList.add('locked');
  function logoHtml(){var sv=$('.brand svg');return sv?sv.outerHTML:''}
  function closeAuth(){if(box){box.remove();box=null}}
  function ensureBox(){
    if(box)return;
    box=document.createElement('div'); box.className='auth';
    box.innerHTML='<div class="auth-card"><div class="auth-logo">'+logoHtml()+'</div><div id="auth-body"></div></div>';
    document.body.appendChild(box);
  }
  function showAuth(){
    if(box)return;
    ensureBox();
    stepEmail('');
  }
  function body(){return $('#auth-body',box)}
  function setMsg(t,ok){var m=$('#auth-msg',box);m.textContent=t||'';m.className='auth-msg'+(ok?' ok':'')}
  function stepEmail(email){
    body().innerHTML='<h2>Acessar o CRM</h2><p>Digite seu e-mail para continuar.</p>'+
      '<form id="f-email" novalidate><label class="field"><span>E-mail</span><input id="a-email" type="email" autocomplete="username" value="'+esc(email)+'" placeholder="voce@veri.com.br"></label>'+
      '<p class="auth-msg" id="auth-msg" role="alert"></p><button class="btn primary" type="submit">Continuar</button></form>';
    var inp=$('#a-email',box); inp.focus();
    $('#f-email',box).addEventListener('submit',function(ev){
      ev.preventDefault();
      var em=inp.value.trim().toLowerCase();
      if(!/^\S+@\S+\.\S+$/.test(em)){setMsg('Digite um e-mail válido.');return}
      setMsg('Verificando…',true);
      auth.fetchSignInMethodsForEmail(em).then(function(m){
        if(m&&m.indexOf('password')>-1)stepLogin(em);else stepCreate(em);
      }).catch(function(){stepLogin(em)});
    });
  }
  function stepLogin(em,info){
    body().innerHTML='<h2>Entrar</h2><p>'+esc(em)+'</p>'+
      '<form id="f-login" novalidate><label class="field"><span>Senha</span><input id="a-pass" type="password" autocomplete="current-password"></label>'+
      '<p class="auth-msg'+(info?' ok':'')+'" id="auth-msg" role="alert">'+esc(info||'')+'</p><button class="btn primary" type="submit">Entrar</button></form>'+
      '<button class="linkbtn" id="a-forgot" type="button">Esqueci minha senha</button>'+
      '<button class="linkbtn" id="a-first" type="button">Primeiro acesso? Criar senha</button>'+
      '<button class="linkbtn" id="a-back" type="button">Trocar e-mail</button>';
    $('#a-pass',box).focus();
    $('#f-login',box).addEventListener('submit',function(ev){
      ev.preventDefault();
      var pw=$('#a-pass',box).value; if(!pw){setMsg('Digite a senha.');return}
      setMsg('Entrando…',true);
      auth.signInWithEmailAndPassword(em,pw).catch(function(e){setMsg(authMsg(e))});
    });
    $('#a-forgot',box).addEventListener('click',function(){
      auth.sendPasswordResetEmail(em).then(function(){setMsg('Enviamos um e-mail para redefinir a senha.',true)}).catch(function(e){setMsg(authMsg(e))});
    });
    $('#a-first',box).addEventListener('click',function(){stepCreate(em)});
    $('#a-back',box).addEventListener('click',function(){stepEmail(em)});
  }
  function stepCreate(em){
    body().innerHTML='<h2>Primeiro acesso</h2><p>Crie uma senha para '+esc(em)+'.</p>'+
      '<form id="f-create" novalidate><label class="field"><span>Criar senha</span><input id="a-pass" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres"></label>'+
      '<label class="field"><span>Repetir senha</span><input id="a-pass2" type="password" autocomplete="new-password"></label>'+
      '<p class="auth-msg" id="auth-msg" role="alert"></p><button class="btn primary" type="submit">Criar senha e entrar</button></form>'+
      '<button class="linkbtn" id="a-have" type="button">Já tenho senha</button>'+
      '<button class="linkbtn" id="a-back" type="button">Trocar e-mail</button>';
    $('#a-pass',box).focus();
    $('#f-create',box).addEventListener('submit',function(ev){
      ev.preventDefault();
      var a=$('#a-pass',box).value, b=$('#a-pass2',box).value;
      if(a.length<6){setMsg('A senha precisa ter pelo menos 6 caracteres.');return}
      if(a!==b){setMsg('As senhas não são iguais.');return}
      setMsg('Criando acesso…',true);
      auth.createUserWithEmailAndPassword(em,a).then(function(cred){return cred.user.sendEmailVerification().catch(function(){})}).catch(function(e){
        if(e&&e.code==='auth/email-already-in-use')stepLogin(em,'Esse e-mail já tem senha. Digite a senha para entrar.');
        else setMsg(authMsg(e));
      });
    });
    $('#a-have',box).addEventListener('click',function(){stepLogin(em)});
    $('#a-back',box).addEventListener('click',function(){stepEmail(em)});
  }
  $('#btn-logout').addEventListener('click',function(){auth.signOut().then(function(){location.reload()})});
  function stepVerify(u){
    body().innerHTML='<h2>Confirme seu e-mail</h2><p>Enviamos um link de confirmação para '+esc(u.email||'')+'. Abra o e-mail, clique no link e volte aqui. Olhe também o spam.</p>'+
      '<p class="auth-msg" id="auth-msg" role="alert"></p>'+
      '<button class="btn primary" id="a-ok" type="button">Já confirmei</button>'+
      '<button class="linkbtn" id="a-resend" type="button">Reenviar e-mail</button>'+
      '<button class="linkbtn" id="a-out" type="button">Sair</button>';
    $('#a-ok',box).addEventListener('click',function(){
      setMsg('Verificando…',true);
      u.reload().then(function(){
        if(!u.emailVerified){setMsg('Ainda não confirmado. Clique no link do e-mail e tente de novo.');return}
        return u.getIdToken(true).then(function(){enter(u)});
      }).catch(function(e){setMsg(authMsg(e))});
    });
    $('#a-resend',box).addEventListener('click',function(){
      u.sendEmailVerification().then(function(){setMsg('E-mail reenviado.',true)}).catch(function(e){setMsg(authMsg(e))});
    });
    $('#a-out',box).addEventListener('click',function(){auth.signOut().then(function(){location.reload()})});
  }
  var entered=false;
  function enter(u){
    if(entered)return; entered=true;
    closeAuth(); document.body.classList.remove('locked');
    var um=$('#user-mail'); um.textContent=u.email||''; um.hidden=false; $('#btn-logout').hidden=false;
    store=dbStore(firebase.firestore()); renderAll();
  }
  auth.onAuthStateChanged(function(u){
    if(u){
      if(!u.emailVerified){ensureBox(); stepVerify(u); return}
      enter(u);
    }else{
      entered=false;
      document.body.classList.add('locked'); showAuth();
    }
  });
}

(function boot(){
  var h=location.hash.replace('#','');
  if(['agendas','kanban','comissao'].indexOf(h)>-1)tab=h;
  renderAll();
  if(FB_ON&&window.firebase){startAuth();return}
  store=localStore();
  renderAll();
})();
})();
</script>

</body></html>
